<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Modern Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .game-container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .header h1 {
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        /* Score Board Styling */
        .score-board {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }

        .badge-custom {
            background: #ff4757;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #user-score, #computer-score {
            font-size: 3rem;
            font-weight: 800;
        }

        /* Message Styling */
        .result-message {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #message {
            font-size: 1.25rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
        }

        /* Choice Icons Styling */
        .choices {
            display: flex;
            justify-content: space-around;
            margin: 2.5rem 0;
        }

        .choice {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 4px solid transparent;
            border-radius: 50%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .choice:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        .choice i {
            font-size: 3rem;
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .game-container {
                margin: 15px;
                padding: 1.5rem;
            }
            .choice {
                width: 80px;
                height: 80px;
            }
            .choice i {
                font-size: 2rem;
            }
            #user-score, #computer-score {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="game-container">
            
            <header class="header">
                <h1>Rock Paper Scissors</h1>
            </header>

            <div class="score-board">
                <div class="text-center">
                    <div class="badge-custom mb-2">PLAYER</div>
                    <span id="user-score">0</span>
                </div>
                <div class="display-4 mx-3">:</div>
                <div class="text-center">
                    <div class="badge-custom mb-2" style="background: #2f3542;">COMP</div>
                    <span id="computer-score">0</span>
                </div>
            </div>
            <div class="d-flex justify-content-center align-items-center gap-4 mb-3">
    <div class="text-center">
        <div class="small text-white-50">YOU</div>
        <div id="user-choice-display" class="fs-1 mt-2">—</div>
    </div>
    <div class="fw-bold fs-3 text-white-50 mt-3">VS</div>
    <div class="text-center">
        <div class="small text-white-50">COMP</div>
        <div id="computer-choice-display" class="fs-1 mt-2">—</div>
    </div>
</div>


            <div class="result-message mb-4">
                <p id="message">Make your move!</p>
            </div>

            <div class="choices">
                <div id="rock" class="choice">
                    <i class="fa-solid fa-hand-back-fist"></i>
                </div>
                <div id="paper" class="choice">
                    <i class="fa-solid fa-hand"></i>
                </div>
                <div id="scissors" class="choice">
                    <i class="fa-solid fa-hand-scissors"></i>
                </div>
            </div>

            <p class="text-white-50 mt-4 small">Choose your weapon to start the game</p>
            <hr class="mt-4" style="opacity: 0.1;">
            <footer class="mt-3">
                <p class="mb-0 small text-white-50">
                    &copy; 2025 <span class="text-white fw-bold">Belinda Martina</span>. All rights reserved.
                </p>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
